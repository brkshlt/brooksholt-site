<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find A Course · Brooks Holt</title>
<meta name="description" content="Every mini golf course Brooks Holt has ever played, with every video. Find a great mini golf course near you.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ee; --panel:#ffffff; --ink:#1b2a22; --muted:#5f6d65; --line:#e3e0d6;
  --green:#1f7a4a; --green-ink:#ffffff; --green-soft:#e4f2ea; --accent:#f2b705; --accent-ink:#1b2a22;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 24px rgba(0,0,0,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111613; --panel:#19201c; --ink:#e9efe9; --muted:#9aa89f; --line:#2a332e;
    --green:#3fb373; --green-ink:#08130d; --green-soft:#1d3327; --accent:#f2b705; --accent-ink:#1b2a22;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#111613; --panel:#19201c; --ink:#e9efe9; --muted:#9aa89f; --line:#2a332e;
  --green:#3fb373; --green-ink:#08130d; --green-soft:#1d3327; --accent:#f2b705; --accent-ink:#1b2a22;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
a{color:inherit}
h1,h2,h3{font-family:"Bricolage Grotesque",Inter,sans-serif;margin:0;line-height:1.1}

/* Header */
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .ball{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,#f2f2f2 40%,#cfcfcf 100%);box-shadow:inset -2px -3px 0 rgba(0,0,0,.08),0 2px 0 var(--green)}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font:500 12px Inter,sans-serif;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stats{display:flex;gap:18px;margin-left:auto}
.stat b{display:block;font:800 20px "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.shop-btn{background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;padding:9px 14px;border-radius:999px;white-space:nowrap}
.shop-btn:hover{filter:brightness(1.05)}

/* Layout */
main{flex:1;display:grid;grid-template-columns:400px 1fr;min-height:0}
#side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
#map{min-height:0;background:var(--line)}
.controls{padding:14px 16px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.controls input,.controls select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.controls input:focus,.controls select:focus{outline:2px solid var(--green);outline-offset:-1px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.near{font:600 14px Inter,sans-serif;border:0;border-radius:10px;padding:9px 12px;background:var(--green);color:var(--green-ink);cursor:pointer;white-space:nowrap;flex:0 0 auto}
.count{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.count label{display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{font:600 12px Inter,sans-serif;white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 10px;cursor:pointer;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.chip small{opacity:.7;font-weight:500;margin-left:3px}
.chip-sep{flex:0 0 1px;background:var(--line);margin:2px 2px}
.pill.closed{background:#fde7e4;color:#b3261e}
.tagrow{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.tagrow .pill{cursor:pointer;margin:0}
#list{overflow:auto;flex:1;padding:6px 8px 8px}
.item{display:flex;gap:12px;padding:8px;border-radius:12px;cursor:pointer;align-items:center;border:1px solid transparent}
.item:hover,.item:focus-visible{background:var(--green-soft);outline:none}
.item.active{border-color:var(--green);background:var(--green-soft)}
.item img{width:96px;height:54px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:var(--line)}
.item h3{font:600 14px/1.3 Inter,sans-serif}
.item .meta{font-size:12px;color:var(--muted);margin-top:2px}
.pill{display:inline-block;font-size:11px;font-weight:600;background:var(--green-soft);color:var(--green);border-radius:999px;padding:1px 8px;margin-right:4px}
.signup{padding:14px 16px;border-top:1px solid var(--line);background:var(--bg)}
.signup p{margin:0 0 8px;font-size:13px}
.signup form{display:flex;gap:6px}
.signup input{flex:1;min-width:0;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);color:var(--ink)}
.signup button{font:600 13px Inter,sans-serif;border:0;border-radius:10px;padding:8px 12px;background:var(--ink);color:var(--panel);cursor:pointer}
.signup .msg{font-size:12px;color:var(--muted);margin-top:6px;min-height:1em}

/* Detail panel */
#detail{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .25s ease;z-index:1000;display:flex;flex-direction:column}
#detail.open{transform:none}
.d-head{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.d-head h2{font-size:24px;font-weight:800;flex:1}
.d-head .sub{font-size:13px;color:var(--muted);margin-top:6px}
.x{border:0;background:var(--bg);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;flex:0 0 auto}
.d-body{overflow:auto;padding:16px 20px 24px}
.player{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.actions{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.btn{font:600 13px Inter,sans-serif;text-decoration:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}
.btn.primary{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.group h4{font:600 12px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.vid{cursor:pointer;border:0;background:none;padding:0;text-align:left;color:var(--ink);font:inherit}
.vid img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;display:block;background:var(--line)}
.vid span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.vid strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;font-weight:600;line-height:1.3;margin-top:5px}
.vid strong+span{margin-top:2px}
.vid.playing img{outline:3px solid var(--green);outline-offset:-3px}
.merch{margin-top:24px;padding:14px 16px;border-radius:12px;background:var(--green-soft);display:flex;gap:12px;align-items:center}
.merch p{margin:0;flex:1;font-size:14px}
.merch b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:17px}
.proto{font-size:11px;color:var(--muted);text-align:center;padding:6px;border-top:1px solid var(--line);background:var(--panel)}

/* Map pins */
.pin{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--green);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.hot{background:var(--accent)}
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:rgba(31,122,74,.25)!important}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background:#1f7a4a!important;color:#fff!important;font:600 12px Inter,sans-serif!important}
.leaflet-popup-content{font:13px Inter,sans-serif}

/* Mobile */
@media (max-width:820px){
  body{overflow:auto}
  header{padding:10px 16px}
  .stats{order:3;width:100%;margin:0;justify-content:space-between}
  .shop-btn{margin-left:auto}
  main{display:flex;flex-direction:column;flex:none}
  #map{height:45vh;flex:0 0 auto;order:-1}
  #side{border-right:0;flex:0 0 auto}
  #list{overflow:visible}
  .controls{padding:12px 16px}
}
</style>
</head>
<body>
<header>
  <a class="brand" href="../">
    <div class="ball" aria-hidden="true"></div>
    <div><h1>Find A Course</h1><small>Brooks Holt Mini Golf</small></div>
  </a>
  <div class="stats" aria-label="Totals">
    <div class="stat"><b id="s-courses">–</b><span>courses played</span></div>
    <div class="stat"><b id="s-videos">–</b><span>videos</span></div>
    <div class="stat"><b id="s-states">–</b><span>states</span></div>
  </div>
  <a class="shop-btn" href="https://shopbrooksholt.com" target="_blank" rel="noopener">Shop merch</a>
</header>

<main>
  <aside id="side">
    <div class="controls">
      <input id="q" type="search" placeholder="Search courses or towns…" aria-label="Search courses">
      <div class="row">
        <select id="state" aria-label="Filter by state"><option value="">All states</option></select>
        <select id="sort" aria-label="Sort">
          <option value="recent">Most recent</option>
          <option value="most">Most played</option>
          <option value="az">A–Z</option>
          <option value="near" disabled>Nearest</option>
        </select>
        <button class="near" id="near" type="button">📍 Near me</button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter by tag"></div>
      <div class="count"><span id="count"></span><label><input type="checkbox" id="showClosed"> Show closed courses</label></div>
    </div>
    <div id="list" role="list"></div>
    <div class="signup">
      <p><b>Get an alert when we play a course near you.</b></p>
      <form id="signup"><input type="email" placeholder="you@email.com" aria-label="Email" required><button>Notify me</button></form>
      <div class="msg" id="signup-msg"></div>
    </div>
  </aside>
  <div id="map" aria-label="Map of courses"></div>
</main>

<section id="detail" aria-label="Course details" aria-hidden="true">
  <div class="d-head">
    <div style="flex:1"><h2 id="d-name"></h2><div class="sub" id="d-sub"></div></div>
    <button class="x" id="d-close" aria-label="Close">×</button>
  </div>
  <div class="d-body" id="d-body"></div>
</section>

<div class="proto">Prototype · course data from the Find A Course map</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const fmt = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : 'Date unknown';
const STATE_ABBR = {"Alabama":"AL","Arizona":"AZ","Arkansas":"AR","California":"CA","Colorado":"CO","Connecticut":"CT","Delaware":"DE","Florida":"FL","Georgia":"GA","Illinois":"IL","Indiana":"IN","Iowa":"IA","Kansas":"KS","Kentucky":"KY","Maryland":"MD","Minnesota":"MN","Missouri":"MO","Nebraska":"NE","New Jersey":"NJ","New York":"NY","North Carolina":"NC","Ohio":"OH","Oklahoma":"OK","Pennsylvania":"PA","South Carolina":"SC","Tennessee":"TN","Texas":"TX","Virginia":"VA","Wisconsin":"WI","At Sea":"Cruise"};
const ab = s => STATE_ABBR[s] || s || '';

let courses = [], bySlug = {}, markers = {}, me = null, activeSlug = null;
const TAG_GROUPS = [
  ['Best Mini Golf Courses', 'Craziest Mini Golf Courses', 'Must Play', 'Hardest', 'Hole-in-One Prize', 'Played 10+ Times', 'Mega Mini Golf'],
  ['Indoor', 'Blacklight', 'Old School', 'Homemade', 'High-Tech'],
  ['Pirate', 'Dinosaur', 'Jungle & Safari', 'Tropical & Tiki', 'Volcano', 'Waterfalls', 'Spooky', 'Space', 'Disney']
];
const TAG_ICON = {'Best Mini Golf Courses':'🏅','Craziest Mini Golf Courses':'🤪','Must Play':'⭐','Hardest':'🔥','Hole-in-One Prize':'🏆','Played 10+ Times':'🔁','Mega Mini Golf':'🏌️','Indoor':'🏠','Blacklight':'🌈','Old School':'📼','Homemade':'🔨','High-Tech':'🤖','Pirate':'🏴‍☠️','Dinosaur':'🦖','Jungle & Safari':'🦍','Tropical & Tiki':'🌴','Volcano':'🌋','Waterfalls':'💧','Spooky':'👻','Space':'👽','Disney':'🏰'};
const activeTags = new Set();
const isClosed = c => c.tags.includes('Closed');

const map = L.map('map', {zoomControl: true}).setView([37.5, -92], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
const cluster = L.markerClusterGroup({showCoverageOnHover: false, maxClusterRadius: 45});
map.addLayer(cluster);

function latestVideo(c){
  let best = null;
  c.groups.forEach(g => g.videos.forEach(v => { if (!best || (v.d || '') > (best.d || '')) best = v; }));
  return best;
}
function miles(a, b){
  const R = 3958.8, t = x => x * Math.PI / 180;
  const dLat = t(b.lat - a.lat), dLng = t(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

fetch('../data/courses.json').then(r => r.json()).then(data => {
  courses = data.filter(c => c.n > 0);
  courses.forEach(c => {
    c.name = c.name.replace(/\s+/g, ' ').trim();
    c.tags = c.tags || [];
    bySlug[c.slug] = c; c.latest = latestVideo(c);
    c.hay = [c.name, c.state || '', ab(c.state), ...c.tags, ...c.groups.flatMap(g => g.videos.map(v => v.t || ''))].join(' ').toLowerCase();
  });
  const tagCount = {}; courses.forEach(c => !isClosed(c) && c.tags.forEach(t => tagCount[t] = (tagCount[t] || 0) + 1));
  $('#chips').innerHTML = TAG_GROUPS.map(g => g.filter(t => tagCount[t]).map(t =>
    `<button class="chip" type="button" aria-pressed="false" data-tag="${esc(t)}">${TAG_ICON[t] || ''} ${esc(t)}<small>${tagCount[t]}</small></button>`).join('')).join('<span class="chip-sep"></span>');

  const states = [...new Set(courses.map(c => c.state).filter(s => s && s !== 'At Sea'))].sort();
  $('#s-courses').textContent = courses.length.toLocaleString();
  $('#s-videos').textContent = courses.reduce((a, c) => a + c.n, 0).toLocaleString();
  $('#s-states').textContent = states.length;
  const counts = {}; courses.forEach(c => counts[c.state] = (counts[c.state] || 0) + 1);
  $('#state').insertAdjacentHTML('beforeend',
    states.concat(counts['At Sea'] ? ['At Sea'] : []).map(s => `<option value="${esc(s)}">${esc(s === 'At Sea' ? 'Cruise ships' : s)} (${counts[s]})</option>`).join(''));

  courses.forEach(c => {
    const hot = c.n >= 10;
    const m = L.marker([c.lat, c.lng], {
      icon: L.divIcon({className: '', html: `<div class="pin${hot ? ' hot' : ''}"></div>`, iconSize: [22, 22], iconAnchor: [11, 22]}),
      title: c.name
    });
    m.bindTooltip(`<b>${esc(c.name)}</b><br>${c.n} video${c.n > 1 ? 's' : ''}`, {direction: 'top', offset: [0, -20]});
    m.on('click', () => location.hash = '#/course/' + c.slug);
    markers[c.slug] = m;
  });
  render();
  route();
});

function filtered(){
  const q = $('#q').value.trim().toLowerCase(), st = $('#state').value, sort = $('#sort').value;
  const showClosed = $('#showClosed').checked;
  let out = courses.filter(c => (!st || c.state === st)
    && (showClosed || !isClosed(c))
    && [...activeTags].every(t => c.tags.includes(t))
    && (!q || q.split(/\s+/).every(w => c.hay.includes(w))));
  if (me) out.forEach(c => c.dist = miles(me, c));
  const cmp = {
    recent: (a, b) => (b.last || '').localeCompare(a.last || ''),
    most: (a, b) => b.n - a.n || (b.last || '').localeCompare(a.last || ''),
    az: (a, b) => a.name.localeCompare(b.name),
    near: (a, b) => a.dist - b.dist
  }[sort];
  return out.sort(cmp);
}

function render(){
  const list = filtered();
  $('#count').textContent = `${list.length} course${list.length === 1 ? '' : 's'}`;
  const show = list.slice(0, 200);
  $('#list').innerHTML = show.map(c => `
    <div class="item${c.slug === activeSlug ? ' active' : ''}" role="listitem" tabindex="0" data-slug="${c.slug}">
      <img loading="lazy" src="${thumb(c.latest.id)}" alt="">
      <div>
        <h3>${esc(c.name)}</h3>
        <div class="meta">${isClosed(c) ? '<span class="pill closed">Closed</span>' : ''}<span class="pill">${c.n} video${c.n > 1 ? 's' : ''}</span>${c.tags.filter(t => TAG_ICON[t]).slice(0, 4).map(t => `<span title="${esc(t)}">${TAG_ICON[t]}</span> `).join('')}${esc(ab(c.state))}${me ? ` · ${Math.round(c.dist)} mi` : ''} · Last played ${fmt(c.last)}</div>
      </div>
    </div>`).join('') + (list.length > show.length ? `<div class="count" style="padding:10px">Showing 200 of ${list.length}. Search or filter to narrow down.</div>` : '');
  cluster.clearLayers();
  cluster.addLayers(list.map(c => markers[c.slug]));
}

$('#list').addEventListener('click', e => { const it = e.target.closest('.item'); if (it) location.hash = '#/course/' + it.dataset.slug; });
$('#list').addEventListener('keydown', e => { if (e.key === 'Enter') { const it = e.target.closest('.item'); if (it) location.hash = '#/course/' + it.dataset.slug; } });
function toggleTag(t, on){
  on ? activeTags.add(t) : activeTags.delete(t);
  document.querySelectorAll('.chip').forEach(ch => ch.setAttribute('aria-pressed', activeTags.has(ch.dataset.tag)));
  render();
}
$('#chips').addEventListener('click', e => { const ch = e.target.closest('.chip'); if (ch) toggleTag(ch.dataset.tag, !activeTags.has(ch.dataset.tag)); });
$('#showClosed').addEventListener('change', render);
['#q', '#state', '#sort'].forEach(s => $(s).addEventListener('input', () => {
  render();
  if (s === '#state') { const l = filtered(); if (l.length) map.fitBounds(L.latLngBounds(l.map(c => [c.lat, c.lng])), {padding: [30, 30], maxZoom: 11}); }
}));

$('#near').addEventListener('click', () => {
  if (!navigator.geolocation) return alert('Location is not available in this browser.');
  $('#near').textContent = 'Locating…';
  navigator.geolocation.getCurrentPosition(p => {
    me = {lat: p.coords.latitude, lng: p.coords.longitude};
    const opt = $('#sort option[value=near]'); opt.disabled = false; $('#sort').value = 'near';
    $('#near').textContent = '📍 Near me';
    render();
    map.setView([me.lat, me.lng], 9);
    L.circleMarker([me.lat, me.lng], {radius: 8, color: '#fff', weight: 3, fillColor: '#2a7de1', fillOpacity: 1}).addTo(map).bindTooltip('You');
  }, () => { $('#near').textContent = '📍 Near me'; alert('Could not get your location.'); });
});

function openCourse(c){
  activeSlug = c.slug;
  document.title = `${c.name} · Find A Course · Brooks Holt`;
  $('#d-name').textContent = c.name;
  const first = c.groups.flatMap(g => g.videos).map(v => v.d).filter(Boolean).sort()[0];
  $('#d-sub').innerHTML = esc(`${c.state === 'At Sea' ? 'Cruise ship' : (c.state || '')} · Played ${c.n} time${c.n > 1 ? 's' : ''}${first ? ' since ' + first.slice(0, 4) : ''}`)
    + (c.tags.length ? `<div class="tagrow">${c.tags.map(t => t === 'Closed'
        ? '<span class="pill closed">Closed</span>'
        : `<span class="pill" role="button" tabindex="0" data-tag="${esc(t)}" title="Show all ${esc(t)} courses">${TAG_ICON[t] || ''} ${esc(t)}</span>`).join('')}</div>` : '');
  const groupsHtml = c.groups.filter(g => g.videos.length).map(g => `
    <div class="group">
      <h4>${esc(g.label || 'Videos')}</h4>
      <div class="vids">${g.videos.map(v => `
        <button class="vid${v.id === c.latest.id ? ' playing' : ''}" data-id="${v.id}" type="button">
          <img loading="lazy" src="${thumb(v.id)}" alt="">
          ${v.t ? `<strong>${esc(v.t)}</strong>` : ''}
          <span>${esc(fmt(v.d))}${v.note ? ' · ' + esc(v.note) : ''}</span>
        </button>`).join('')}</div>
    </div>`).join('');
  $('#d-body').innerHTML = `
    <div class="player"><iframe id="player" src="https://www.youtube-nocookie.com/embed/${c.latest.id}?rel=0" title="Brooks Holt video" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
    <div class="actions">
      <a class="btn primary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}">Directions</a>
      <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.name)}&query_place_id=">Course info</a>
      <button class="btn" id="share" type="button">Copy link</button>
    </div>
    ${groupsHtml}
    <div class="merch"><p><b>Heading out to play?</b>Grab a Skully hat or tee before your round.</p><a class="shop-btn" href="https://shopbrooksholt.com" target="_blank" rel="noopener">Shop</a></div>`;
  $('#detail').classList.add('open');
  $('#detail').setAttribute('aria-hidden', 'false');
  $('#d-body').scrollTop = 0;
  map.setView([c.lat, c.lng], Math.max(map.getZoom(), 13));
  document.querySelectorAll('.item').forEach(el => el.classList.toggle('active', el.dataset.slug === c.slug));
}
function closeCourse(){
  activeSlug = null;
  document.title = 'Find A Course · Brooks Holt';
  $('#detail').classList.remove('open');
  $('#detail').setAttribute('aria-hidden', 'true');
  $('#d-body').innerHTML = '';
  document.querySelectorAll('.item.active').forEach(el => el.classList.remove('active'));
}
$('#d-body').addEventListener('click', e => {
  const v = e.target.closest('.vid');
  if (v) {
    $('#player').src = `https://www.youtube-nocookie.com/embed/${v.dataset.id}?rel=0&autoplay=1`;
    document.querySelectorAll('.vid').forEach(x => x.classList.toggle('playing', x === v));
    $('#d-body').scrollTop = 0;
  }
  if (e.target.id === 'share') {
    navigator.clipboard?.writeText(location.href).then(() => { e.target.textContent = 'Copied!'; setTimeout(() => e.target.textContent = 'Copy link', 1500); });
  }
});
$('#d-close').addEventListener('click', () => location.hash = '#/');
$('#d-sub').addEventListener('click', e => {
  const p = e.target.closest('[data-tag]');
  if (p) { activeTags.clear(); toggleTag(p.dataset.tag, true); location.hash = '#/'; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && activeSlug) location.hash = '#/'; });

function route(){
  const m = location.hash.match(/^#\/course\/(.+)$/);
  const c = m && bySlug[decodeURIComponent(m[1])];
  c ? openCourse(c) : closeCourse();
}
window.addEventListener('hashchange', route);

$('#signup').addEventListener('submit', e => {
  e.preventDefault();
  $('#signup-msg').textContent = 'Prototype: email signup is not connected yet.';
});
</script>
</body>
</html>
