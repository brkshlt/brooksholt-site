# Runs every morning: re-reads the public Find A Course map, video titles and
# playlist feeds, then publishes the refreshed course data. Public data only.
name: Daily course update

on:
  schedule:
    - cron: "15 9 * * *"   # 9:15 UTC = early morning US time
  workflow_dispatch: {}     # also adds a "Run workflow" button for manual updates

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update from the map and playlists
        run: python build/update_from_map.py
      - name: Save changes
        run: |
          git config user.name "find-a-course-bot"
          git config user.email "find-a-course-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily course update $(date -u +%F)"
          git push
